<!doctype html>
<html lang="tr">
<head>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <a class="skip" href="#app">İçeriğe geç</a>

  <header class="hdr" id="hdr">
    <div class="wrap hdr-in">
      <a href="#/" class="logo" id="logo" aria-label="SXX Consultancy"></a>
      <nav class="nav" id="nav" aria-label="Ana menü"></nav>
      <div class="hdr-act">
        <button class="ai-pill" id="aiPill" data-ai></button>
        <div class="langsw" id="langSw" role="group" aria-label="Dil / Language"></div>
        <button class="ibtn" id="themeBtn" aria-label="Tema">
          <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

        <button class="ibtn burger" id="burger" aria-label="Menü" aria-expanded="false"><span></span><span></span><span></span></button>

    </div>

  <main id="app" tabindex="-1"></main>
  <footer class="ftr" id="ftr"></footer>

  <div class="dock" id="dock"></div>

    <div class="ai-body" id="aiBody"></div>
    <div class="ai-sug" id="aiSug"></div>
    <form class="ai-in" id="aiForm"><input id="aiText" autocomplete="off" aria-label="Mesaj"><button aria-label="Gönder"><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button></form>
  </section>

  <div class="toast" id="toast" role="status"></div>

  <script src="assets/data.js?v=4"></script>
  <script src="assets/app.js?v=4"></script>
